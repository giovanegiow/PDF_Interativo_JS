<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Gerar PDF com Excel</title>
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div id="telaPrincipal" class="col-3 mx-auto mt-5 d-flex align-items-center justify-content-center">
        <div class="text-center">
            <div class="mb-3">
                <button type="button" class="btn btn-primary btn-lg" onclick="document.getElementById('excelFile').click()">Selecionar arquivo Excel</button>
                <input type="file" id="excelFile" name="excelFile" accept=".xlsx, .xls" hidden>
            </div>

            <p id="textoBoasVindas">Olá, gere seu PDF aqui</p>
        </div>
    </div>

    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="principal.js"></script>
</body>

</html>
