<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Catálogo de Produtos</title>

    <style>
        body {
            width: 21cm;
            height: 29.7cm;
            margin: auto;
            background: #f1f1f1;
            font-family: Arial, Helvetica, sans-serif;
        }

        .pagina {
            background: white;
            padding: 20px;
        }

        .topoCatalogo {
            border-bottom: 2px solid #e5e5e5;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
        }

        .tituloCatalogo {
            font-size: 28px;
            font-weight: bold;
        }

        #gridProdutos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .cardProduto {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .cardProduto img {
            width: 100%;
            height: 120px;
            object-fit: contain;
        }

        .nomeProduto {
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
        }

        .descricaoProduto {
            font-size: 12px;
            color: #666;
            height: 32px;
            overflow: hidden;
        }

        .precoProduto {
            margin-top: 6px;
            font-size: 16px;
            font-weight: bold;
            color: #0d6efd;
        }

        .btnMaisInformacoes {
            font-size: 12px;
        }
    </style>

</head>

<body id="corpoCatalogo">

    <div class="pagina">

        <div class="topoCatalogo d-flex align-items-center justify-content-between">

            <div class="d-flex align-items-center gap-3">
                <img class="logo" src="https://via.placeholder.com/80">
                <div class="tituloCatalogo">Catálogo de Produtos</div>
            </div>

            <div>
                <small>Data: 03/2026</small>
            </div>

        </div>

        <div id="gridProdutos">

            <div class="cardProduto">
                <img src="https://via.placeholder.com/150">
                <div class="nomeProduto">Produto 1</div>
                <button type="button" class="btn btn-info btnMaisInformacoes mb-1 mt-1">Quero mais informações</button>
                <div class="precoProduto">R$ 59,90</div>
            </div>

            <div class="cardProduto">
                <img src="https://via.placeholder.com/150">
                <div class="nomeProduto">Produto 2</div>
                <button type="button" class="btn btn-info btnMaisInformacoes mb-1 mt-1">Quero mais informações</button>
                <div class="precoProduto">R$ 29,90</div>
            </div>

            <div class="cardProduto">
                <img src="https://via.placeholder.com/150">
                <div class="nomeProduto">Produto 3</div>
                <button type="button" class="btn btn-info btnMaisInformacoes mb-1 mt-1">Quero mais informações</button>
                <div class="precoProduto">R$ 39,90</div>
            </div>

            <div class="cardProduto">
                <img src="https://via.placeholder.com/150">
                <div class="nomeProduto">Produto 4</div>
                <button type="button" class="btn btn-info btnMaisInformacoes mb-1 mt-1">Quero mais informações</button>
                <div class="precoProduto">R$ 129,90</div>
            </div>

            <div class="cardProduto">
                <img src="https://via.placeholder.com/150">
                <div class="nomeProduto">Produto 5</div>
                <button type="button" class="btn btn-info btnMaisInformacoes mb-1 mt-1">Quero mais informações</button>
                <div class="precoProduto">R$ 19,90</div>
            </div>

            <div class="cardProduto">
                <img src="https://via.placeholder.com/150">
                <div class="nomeProduto">Produto 6</div>
                <button type="button" class="btn btn-info btnMaisInformacoes mb-1 mt-1">Quero mais informações</button>
                <div class="precoProduto">R$ 309,90</div>
            </div>

        </div>

    </div>
</body>

</html>
